appId: com.copycat.app
productName: Copycat
directories:
  output: release
files:
  - out/**/*
  - resources/**/*
# electron-updater reads this feed from inside the installed app, so a release
# published here is picked up by every machine that already has Copycat.
publish:
  provider: github
  owner: murpiano
  repo: copycat
  # Published outright, not as a draft: electron-updater cannot see drafts,
  # so a drafted release would reach nobody until someone published it by hand.
  releaseType: release
win:
  target: nsis
  icon: resources/small/small.ico
  artifactName: Copycat-Setup-${version}.${ext}
nsis:
  installerSidebar: resources/large/installer-sidebar.bmp
  installerIcon: resources/small/small.ico
  uninstallerIcon: resources/small/small.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Copycat
