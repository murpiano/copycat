# Checks commit messages of every push and the title, description and
# commits of every pull request. Created by `kysaro init`.
name: kysaro

on:
  push:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  kysaro:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # 22, not 24: better-sqlite3's prebuilt binary targets this ABI; on 24 npm falls
          # back to node-gyp, which crashes in cacache's promisify call (unrelated to kysaro
          # itself) — see ci.yml's own note on the same pin.
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check messages
        run: npx kysaro ci
