name: release

# Builds the Windows installer on a real Windows runner: better-sqlite3 is a
# native module, so it has to be compiled for win32 where it will run.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 24: better-sqlite3 ships a prebuilt binary for this ABI,
          # so neither npm ci nor the Electron rebuild needs a C++ toolchain.
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # electron-builder packages out/, so the bundles have to exist first.
      - run: npm run build

      - name: Build and publish the installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
