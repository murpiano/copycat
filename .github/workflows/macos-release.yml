name: macOS installer

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Match package version to release tag
        shell: bash
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build and publish installer
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Developer ID yet (see electron-builder.yml): keep electron-builder
          # from picking up any ad-hoc signing identity the runner happens to have.
          CSC_IDENTITY_AUTO_DISCOVERY: false
